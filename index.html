<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Plan Processor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="pdf.min.js"></script> <!-- Local pdf.js -->
</head>
<body>
    <h1>Upload Structural Plan PDF</h1>
    <input type="file" id="pdfUpload" accept=".pdf">
    <button id="processBtn">Process PDF</button>
    
    <div id="output">
        <h2>Invoice</h2>
        <div id="invoiceOutput"></div>
        
        <h2>Material Takeoff</h2>
        <div id="takeoffOutput"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
