<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Plan Processor</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Upgraded Dancing + Basketball Stick Figures */
        body {
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            background: #f9f9f9; /* Light bg to make them pop */
        }

        .stickman {
            position: fixed;
            bottom: 30px;
            width: 120px; /* Bigger! */
            height: 240px;
            opacity: 0.6; /* More visible */
            z-index: -1;
        }

        .stickman.left { left: 80px; animation: dance 4s infinite ease-in-out; }
        .stickman.center { left: 50%; transform: translateX(-50%); bottom: 60px; animation: dunkJump 6s infinite ease-in-out; }
        .stickman.right { right: 80px; animation: dance 4s infinite ease-in-out 1s; }

        /* Basic stick figure */
        .stickman::before { /* Head */
            content: '';
            position: absolute;
            top: 0;
            left: 45px;
            width: 30px;
            height: 30px;
            border: 6px solid #333;
            border-radius: 50%;
        }

        .stickman::after { /* Body */
            content: '';
            position: absolute;
            top: 36px;
            left: 57px;
            width: 6px;
            height: 100px;
            background: #333;
        }

        .arm-left, .arm-right, .leg-left, .leg-right {
            position: absolute;
            width: 6px;
            height: 80px;
            background: #333;
            transform-origin: top center;
        }

        .arm-left { top: 40px; left: 40px; transform: rotate(40deg); animation: swingArm 2s infinite ease-in-out; }
        .arm-right { top: 40px; left: 74px; transform: rotate(-40deg); animation: swingArm 2s infinite ease-in-out 0.5s; }
        .leg-left { top: 130px; left: 50px; transform: rotate(-20deg); animation: swingLeg 2s infinite ease-in-out 1s; }
        .leg-right { top: 130px; left: 64px; transform: rotate(20deg); animation: swingLeg 2s infinite ease-in-out 1.5s; }

        @keyframes swingArm {
            0%, 100% { transform: rotate(40deg); }
            50% { transform: rotate(-40deg); }
        }

        .arm-right { animation-direction: reverse; }

        @keyframes swingLeg {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(30deg); }
        }

        .leg-right { animation-direction: reverse; }

        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-20px) rotate(8deg); }
            50% { transform: translateY(15px) rotate(-8deg); }
            75% { transform: translateY(-20px) rotate(8deg); }
        }

        /* Basketball for center guy */
        .basketball {
            position: absolute;
            width: 20px;
            height: 20px;
            background: orange;
            border-radius: 50%;
            top: 180px;
            left: 60px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
            animation: dribble 1.5s infinite ease-in-out, bounceBall 6s infinite;
        }

        .basketball::before, .basketball::after {
            content: '';
            position: absolute;
            background: #333;
            width: 20px;
            height: 3px;
            top: 8px;
            left: 0;
        }

        .basketball::after {
            transform: rotate(90deg);
        }

        @keyframes dribble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(40px); }
        }

        /* Dunk jump animation for center */
        @keyframes dunkJump {
            0% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-100px); } /* Jump high */
            50% { transform: translateX(-50%) translateY(-120px) rotate(20deg); } /* Lean for dunk */
            60% { transform: translateX(-50%) translateY(-80px); }
            100% { transform: translateX(-50%) translateY(0); }
        }

        @keyframes bounceBall {
            0% { top: 180px; left: 60px; }
            40% { top: 100px; left: 60px; } /* Up with jump */
            50% { top: 80px; left: 100px; } /* Dunk over right guy */
            60% { top: 140px; left: 80px; }
            100% { top: 180px; left: 60px; }
        }
    </style>
</head>
<body>
    <!-- Upgraded stick figures -->
    <div class="stickman left">
        <div class="arm-left"></div>
        <div class="arm-right"></div>
        <div class="leg-left"></div>
        <div class="leg-right"></div>
    </div>

    <!-- Center baller with basketball -->
    <div class="stickman center">
        <div class="arm-left"></div>
        <div class="arm-right"></div>
        <div class="leg-left"></div>
        <div class="leg-right"></div>
        <div class="basketball"></div>
    </div>

    <div class="stickman right">
        <div class="arm-left"></div>
        <div class="arm-right"></div>
        <div class="leg-left"></div>
        <div class="leg-right"></div>
    </div>

    <!-- Your app -->
    <h1>Upload Structural Plan PDF</h1>
    <input type="file" id="pdfUpload" accept=".pdf">
    <button id="processBtn">Process PDF</button>
    
    <div id="output">

        <div id="invoiceOutput"></div>
        
        <h2>Material Takeoff</h2>
        <div id="takeoffOutput"></div>
    </div>

</body>
</html>
